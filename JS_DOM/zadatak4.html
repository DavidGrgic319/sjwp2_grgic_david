<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <title>Uređivanje odlomka</title>
  </head>
  <body>
    <p id="opis">Početni</p>

    <script>
      const odlomak = document.getElementById("opis");

      odlomak.style.backgroundColor = "lightblue";
      odlomak.style.padding = "20px";
      odlomak.style.textAlign = "center";
    </script>
  </body>
</html>
