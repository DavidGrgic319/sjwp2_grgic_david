<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <title>Promjena više elemenata</title>
  </head>
  <body>
    <p>Prvi odlomak</p>
    <p>Drugi odlomak</p>
    <p>Treći odlomak</p>
