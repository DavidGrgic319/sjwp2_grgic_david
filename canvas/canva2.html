<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuca</title>
</head>
<body>
    <canvas id="myCanvas" width="600" height="600" style="border: 1px black solid;"></canvas>
    <script>
        let c = document.getElementById("myCanvas");
        let ctx = c.getContext("2d");

        ctx.beginPath();
        ctx.rect(100,200, 400,300);
        ctx.fillStyle ="blue";
        ctx.fill();

        ctx.beginPath();
        ctx,moveTo(100,200);
        ctx.lineTo(500,200);
        ctx.lineTo(300,100);
        ctx.lineTo(100,200);
        ctx.fillStyle="red";
        ctx.fill();
        

    </script>

    
</body>
</html>
